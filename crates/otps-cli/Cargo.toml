[package]
name = "otps-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "otps: timing-correlation diff CLI (offline, zero telemetry)"

[[bin]]
name = "otps"
path = "src/main.rs"

[dependencies]
otps-core = { path = "../otps-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[lints]
workspace = true
