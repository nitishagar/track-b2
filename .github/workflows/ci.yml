name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo build --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cargo test --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # otps-wasm excluded: wasm-bindgen tracks newer rustc than MSRV 1.85.
      - run: cargo build --locked -p otps-core -p otps-cli
      - run: cargo test --locked -p otps-core -p otps-cli
  wasm-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Pinned wasm-pack from the official release tarball (the installer
      # script tracks latest, which would make the build smoke float).
      - name: Install wasm-pack 0.13.1
        run: |
          curl -sSL -o /tmp/wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wasm-pack.tar.gz -C /tmp
          echo /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
      - run: wasm-pack --version
      # Build smoke: the wasm target must compile (into a temp dir so the
      # committed bundle is never dirtied). Byte-reproducibility across
      # toolchains is NOT assumed: rustc version changes wasm bytes.
      - run: wasm-pack build crates/otps-wasm --target web --out-dir /tmp/wasm-pkg-smoke
      # Functional drift check: the COMMITTED docs/pkg/ must reproduce the
      # current CLI's --format json bytes on all fixture pairs. Fails when
      # core changed without a docs/pkg/ rebuild (rebuild with the P0
      # command and commit docs/pkg/).
      - run: cargo build --locked -p otps-cli
      - run: node scripts/wasm-parity.mjs
